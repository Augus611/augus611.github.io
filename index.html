<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Augusto Gonzalez</title>
    <style>
        :root {
            --bg-env: #131316;
            --folder-back: #d49a2a;
            --folder-front: #f3c65f;
            --folder-tab: #b5801d;
            --paper: #fcfbfa;
            --ink: #1f2937;
            --idle-animation-delay: 5s;
            --idle-animation-duration: 2s;
            --idle-sway-angle: 15deg;
            --idle-open-angle: 20deg;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-env);
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 2000px;
            user-select: none;
        }

        .instrucciones {
            position: absolute;
            top: 25px;
            color: #71717a;
            text-align: center;
            font-size: 0.85rem;
            max-width: 600px;
            line-height: 1.5;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .instrucciones.visible {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            .global-viewport.idle-sway {
                animation: none;
            }
        }

        /* CONTENEDOR GLOBAL: ROTACIÓN SIMÉTRICA */
        .global-viewport {
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
            padding: 50px;
            transition: transform 0.05s ease-out;
        }

        .global-viewport.idle-sway {
            animation: folder-sway var(--idle-animation-duration) ease-in-out var(--idle-animation-delay) infinite;
        }

        @keyframes folder-sway {
            0%, 8%, 40%, 100% { transform: rotateX(0deg) rotateY(0deg); }
            18% { transform: rotateX(0deg) rotateY(calc(0deg - var(--idle-sway-angle))); }
            29% { transform: rotateX(0deg) rotateY(var(--idle-sway-angle)); }
        }

        /* OBJETO CARPETA WINDOWS */
        .folder-container {
            width: 420px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            cursor: grab;
        }

        .folder-container:active {
            cursor: grabbing;
        }

        .folder-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--folder-back);
            transform: translateZ(-2px);
            border-radius: 0 16px 16px 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            z-index: 1;
        }

        .folder-back::before {
            content: '';
            position: absolute;
            top: -24px;
            left: 0;
            width: 130px;
            height: 25px;
            background-color: var(--folder-tab);
            border-radius: 12px 12px 0 0;
        }

        .folder-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--folder-front);
            border-radius: 16px;
            bottom: 0;
            transform-origin: bottom center;
            z-index: 10;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.4);
            transform: rotateX(0deg);
            pointer-events: none;
        }

        /* CONTENEDOR DE LAS HOJAS INTERNAS */
        .paper-stack {
            position: absolute;
            width: 92%;
            left: 4%;
            top: 7px;
            bottom: 1px;
            z-index: 5;
            transform-style: preserve-3d;
        }

        /* ESTILO GENERAL DE LAS HOJAS */
        .paper-sheet {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-origin: bottom center;
            transform-style: preserve-3d;
            transition: none;
        }

        .paper-face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--paper);
            border-radius: 4px;
            padding: 1.8rem;
            color: var(--ink);
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transform-origin: bottom center;
            transform-style: preserve-3d;
            opacity: 1;
            transition: box-shadow 0.3s ease;
        }

        .paper-face:hover {
            box-shadow: 0 0 20px rgba(243, 198, 95, 0.8);
        }

        .paper-face h2 {
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
            border-bottom: 2px dashed #cbd5e1;
            padding-bottom: 0.25rem;
            text-transform: uppercase;
        }

        .bold-tag {
            font-weight: bold;
            background: rgba(0,0,0,0.06);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 0.25rem;
        }

        .paper-face p {
            font-size: 0.85rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="instrucciones" aria-hidden="true">
        <p><strong>Click Izquierdo + Arrastrar abajo:</strong> Abre la carpeta en abanico.</p>
        <p style="margin-top: 0.3rem; color: #a1a1aa;"><strong>Rueda del Medio + Arrastrar:</strong> Rota la carpeta.</p>
    </div>

    <div class="global-viewport" id="viewport">
        <div class="folder-container" id="folder">
            
            <div class="folder-back"></div>

            <!-- Contenedor que inyectará las hojas de tu CV automáticamente -->
            <div class="paper-stack" id="paper-stack-container"></div>

            <div class="folder-front" id="front-cover"></div>

        </div>
    </div>

    <script>
        // CONFIGURACIONES MECÁNICAS ACCESIBLES
        const MIN_FOLDER_OPENING = 5;
        const MAX_FOLDER_OPENING = 80; 
        const MAX_3D_ROTATION    = 60; 
        const PAPER_BACK_OFFSET = -1;
        const PAPER_STACK_SPACING = 0.1;
        const PAPER_FAN_FOLLOW = 0.9;
        const PAPER_RESTING_SCALE = 1.007469;

        const viewport = document.getElementById('viewport');
        const folder = document.getElementById('folder');
        const instructions = document.querySelector('.instrucciones');
        const frontCover = document.getElementById('front-cover');
        const paperStackContainer = document.getElementById('paper-stack-container');
        
        let sheets = []; 
        let isDraggingLeft = false;
        let startLeftY = 0;
        let currentOpenProgress = MIN_FOLDER_OPENING; 
        let activeExtractedSheet = null;

        let isDraggingMiddle = false;
        let startMiddleX = 0;
        let startMiddleY = 0;
        let currentRotX = 0;
        let currentRotY = 0;
        let instructionsTimer;
        let showInstructionsAfterIdleCycle = false;
        let idleAnimationActive = false;
        let idleAnimationFrame;
        let idleAnimationStart;
        let lastIdleCycle = -1;
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const idleAnimationDelay = getCssTimeInMilliseconds('--idle-animation-delay');
        const idleAnimationDuration = Math.max(1, getCssTimeInMilliseconds('--idle-animation-duration'));
        const idleOpeningAngle = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--idle-open-angle'));

        function getCssTimeInMilliseconds(variableName) {
            const value = getComputedStyle(document.documentElement).getPropertyValue(variableName).trim();
            const duration = parseFloat(value);
            return value.endsWith('ms') ? duration : duration * 1000;
        }

        function easeInOut(progress) {
            return (1 - Math.cos(Math.PI * progress)) / 2;
        }

        function animateIdleOpening(timestamp) {
            if (!idleAnimationActive) return;

            const elapsed = timestamp - idleAnimationStart;

            let progress = 0;
            if (elapsed >= idleAnimationDelay) {
                const cycleElapsed = elapsed - idleAnimationDelay;
                const cycle = Math.floor(cycleElapsed / idleAnimationDuration);

                if (showInstructionsAfterIdleCycle && lastIdleCycle >= 0 && cycle > lastIdleCycle) {
                    revealInstructions();
                    return;
                }
                lastIdleCycle = cycle;
                const phase = (cycleElapsed % idleAnimationDuration) / idleAnimationDuration;
                const maxProgress = Math.min(100, (idleOpeningAngle / MAX_FOLDER_OPENING) * 100);

                if (phase >= 0.08 && phase < 0.22) {
                    progress = easeInOut((phase - 0.08) / 0.14) * maxProgress;
                } else if (phase >= 0.22 && phase < 0.4) {
                    progress = (1 - easeInOut((phase - 0.22) / 0.18)) * maxProgress;
                }
            }

            updateMechanics(progress);
            idleAnimationFrame = requestAnimationFrame(animateIdleOpening);
        }

        function resetInstructionsTimer() {
            if (instructions.classList.contains('visible')) return;

            clearTimeout(instructionsTimer);
            instructionsTimer = setTimeout(() => {
                if (idleAnimationActive) {
                    showInstructionsAfterIdleCycle = true;
                    return;
                }

                revealInstructions();
            }, 10000);
        }

        function revealInstructions() {
            showInstructionsAfterIdleCycle = false;
            stopIdleAnimation();
            instructions.classList.add('visible');
            instructions.setAttribute('aria-hidden', 'false');
        }

        function stopIdleAnimation() {
            showInstructionsAfterIdleCycle = false;
            idleAnimationActive = false;
            cancelAnimationFrame(idleAnimationFrame);
            viewport.classList.remove('idle-sway');
            updateMechanics(currentOpenProgress);
        }

        if (!prefersReducedMotion) {
            idleAnimationActive = true;
            idleAnimationStart = performance.now();
            viewport.classList.add('idle-sway');
            idleAnimationFrame = requestAnimationFrame(animateIdleOpening);
        }

        window.addEventListener('pointerdown', (event) => {
            if (event.target instanceof Node && folder.contains(event.target)) {
                stopIdleAnimation();
            }
        }, true);

        ['pointerdown', 'pointermove', 'wheel', 'click'].forEach((eventName) => {
            window.addEventListener(eventName, (event) => {
                if ((event.target instanceof Node && folder.contains(event.target)) || isDraggingLeft || isDraggingMiddle) {
                    resetInstructionsTimer();
                }
            }, true);
        });

        resetInstructionsTimer();

        window.addEventListener('contextmenu', (e) => {
            if (e.button === 1) e.preventDefault();
        });

        // CARGA DINÁMICA DEL CV DESDE EL ARCHIVO DE TEXTO PLANO
        async function cargarDatosCV() {
            try {
                const respuesta = await fetch('cv-datos.json');
                const datos = await respuesta.json();
                
                paperStackContainer.innerHTML = '';

                datos.forEach((seccion, index) => {
                    const hoja = document.createElement('div');
                    hoja.className = 'paper-sheet';
                    hoja.style.zIndex = datos.length - index; 

                    let tagesHTML = '';
                    seccion.tags.forEach(tag => {
                        tagesHTML += `<span class="bold-tag">${tag}</span><br>`;
                    });

                    const face = document.createElement('div');
                    face.className = 'paper-face';
                    face.innerHTML = `
                        <h2>${seccion.titulo}</h2>
                        ${tagesHTML}
                        <p style="margin-top: 0.5rem;">${seccion.descripcion}</p>
                    `;
                    hoja.appendChild(face);

                    hoja.onclick = (event) => toggleIsolatedFlightWithReturn(hoja, event);
                    paperStackContainer.appendChild(hoja);
                });

                sheets = document.querySelectorAll('.paper-sheet');
                updateMechanics(0);

            } catch (error) {
                console.error("Error al cargar los datos del CV:", error);
                paperStackContainer.innerHTML = `<div class="paper-sheet" style="z-index:1;"><div class="paper-face"><h2 style="color:red;">Error de Carga</h2><p>Verifica que tu archivo 'cv-datos.json' esté en la raíz del repositorio.</p></div></div>`;
            }
        }

        cargarDatosCV();

        window.addEventListener('mousedown', (e) => {
            if (activeExtractedSheet) return; 

            if (e.button === 0) {
                isDraggingLeft = true;
                startLeftY = e.clientY;
                frontCover.style.transition = 'none';
            } else if (e.button === 1) {
                e.preventDefault();
                isDraggingMiddle = true;
                startMiddleX = e.clientX;
                startMiddleY = e.clientY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDraggingLeft && !activeExtractedSheet) {
                const deltaY = e.clientY - startLeftY;
                startLeftY = e.clientY;

                currentOpenProgress += deltaY * 0.4;
                currentOpenProgress = Math.max(MIN_FOLDER_OPENING, Math.min(100, currentOpenProgress));

                updateMechanics(currentOpenProgress);
            }

            if (isDraggingMiddle && !activeExtractedSheet) {
                const deltaX = e.clientX - startMiddleX;
                const deltaY = e.clientY - startMiddleY;
                
                startMiddleX = e.clientX;
                startMiddleY = e.clientY;

                currentRotY += deltaX * 0.25; 
                currentRotX -= deltaY * 0.25; 

                currentRotX = Math.max(-MAX_3D_ROTATION, Math.min(MAX_3D_ROTATION, currentRotX));
                currentRotY = Math.max(-MAX_3D_ROTATION, Math.min(MAX_3D_ROTATION, currentRotY));

                viewport.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) isDraggingLeft = false;
            if (e.button === 1) isDraggingMiddle = false;
        });

        function updateMechanics(progress) {
            progress = Math.max(MIN_FOLDER_OPENING, Math.min(100, progress));
            const factor = progress / 100;
            const targetAngle = factor * -MAX_FOLDER_OPENING;
            
            frontCover.style.transform = `rotateX(${targetAngle}deg)`;

            if (progress < 15) {
                frontCover.style.pointerEvents = 'auto';
            } else {
                frontCover.style.pointerEvents = 'none';
            }

            sheets.forEach((sheet, idx) => {
                if (sheet !== activeExtractedSheet && !sheet.classList.contains('returning-sheet')) {
                    const face = sheet.querySelector('.paper-face');
                    const { depth, fanDepth, fanAngle } = getPaperPose(idx, targetAngle);
                    sheet.style.transform = `translateZ(${depth}px) scaleY(${PAPER_RESTING_SCALE})`;
                    face.style.transform = `translateZ(${fanDepth}px) rotateX(${fanAngle}deg)`;
                    sheet.style.visibility = Math.abs(targetAngle) < 1 ? 'hidden' : 'visible';
                }
            });
        }

        function getPaperPose(index, targetAngle) {
            const distanceFromBack = sheets.length - 1 - index;
            const fanProgress = sheets.length > 1 ? distanceFromBack / (sheets.length - 1) : 0;
            return {
                depth: PAPER_BACK_OFFSET,
                fanDepth: distanceFromBack * PAPER_STACK_SPACING,
                fanAngle: targetAngle * PAPER_FAN_FOLLOW * fanProgress
            };
        }

        function toggleIsolatedFlightWithReturn(sheetElement, event) {
            event.stopPropagation(); 

            if (sheetElement === activeExtractedSheet) {
                activeExtractedSheet = null;
                sheetElement.classList.add('returning-sheet');
                sheetElement.style.transition = 'transform 0.45s cubic-bezier(0.25, 1, 0.5, 1)';
                
                const idx = Array.from(sheets).indexOf(sheetElement);
                const factor = currentOpenProgress / 100;
                const targetAngle = factor * -MAX_FOLDER_OPENING;
                const { depth, fanDepth, fanAngle } = getPaperPose(idx, targetAngle);
                const face = sheetElement.querySelector('.paper-face');
                
                sheetElement.style.transform = `translateZ(${depth}px) scaleY(${PAPER_RESTING_SCALE})`;
                face.style.transform = `translateZ(${fanDepth}px) rotateX(${fanAngle}deg)`;

                setTimeout(() => {
                    sheetElement.classList.remove('returning-sheet');
                    sheetElement.style.transition = '';
                    sheetElement.style.zIndex = ''; 
                    updateMechanics(currentOpenProgress);
                }, 450);

            } else {
                if (activeExtractedSheet || document.querySelector('.returning-sheet')) return; 
                
                activeExtractedSheet = sheetElement;
                sheetElement.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.3, 1)';
                sheetElement.style.zIndex = '999999';
                sheetElement.querySelector('.paper-face').style.transform = 'none';

                const invX = -currentRotX;
                const invY = -currentRotY;

                sheetElement.style.transform = `translateY(-140px) translateZ(450px) rotateY(${invY}deg) rotateX(${invX}deg) scale(1.35)`;
            }
        }
    </script>
</body>
</html>
