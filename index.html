<body>

    <div class="instrucciones">
        <p><strong>Click Izquierdo + Arrastrar abajo:</strong> Abre la carpeta CV en abanico (Límite 80°).</p>
        <p style="margin-top: 0.3rem; color: #a1a1aa;"><strong>Rueda del Medio + Arrastrar:</strong> Rota el maletín de forma simétrica (Límite 45°).</p>
    </div>

    <div class="global-viewport" id="viewport">
        <div class="folder-container" id="folder">
            
            <div class="folder-back"></div>

            <!-- Contenedor que inyectará las hojas de tu CV automáticamente -->
            <div class="paper-stack" id="paper-stack-container"></div>

            <div class="folder-front" id="front-cover"></div>

        </div>
    </div>

    <script>
        // CONFIGURACIONES MECÁNICAS ACCESIBLES
        const MAX_FOLDER_OPENING = 80; 
        const MAX_3D_ROTATION    = 45; 

        const viewport = document.getElementById('viewport');
        const frontCover = document.getElementById('front-cover');
        const paperStackContainer = document.getElementById('paper-stack-container');
        
        let sheets = []; 
        let isDraggingLeft = false;
        let startLeftY = 0;
        let currentOpenProgress = 0; 
        let activeExtractedSheet = null;

        let isDraggingMiddle = false;
        let startMiddleX = 0;
        let startMiddleY = 0;
        let currentRotX = 0;
        let currentRotY = 0;

        window.addEventListener('contextmenu', (e) => {
            if (e.button === 1) e.preventDefault();
        });

        // CARGA DINÁMICA DEL CV DESDE EL ARCHIVO DE TEXTO PLANO
        async function cargarDatosCV() {
            try {
                const respuesta = await fetch('cv-datos.json');
                const datos = await respuesta.json();
                
                paperStackContainer.innerHTML = '';

                datos.forEach((seccion, index) => {
                    const hoja = document.createElement('div');
                    hoja.className = 'paper-sheet';
                    hoja.style.zIndex = datos.length - index; 

                    let tagesHTML = '';
                    seccion.tags.forEach(tag => {
                        tagesHTML += `<span class="bold-tag">${tag}</span><br>`;
                    });

                    hoja.innerHTML = `
                        <h2>${seccion.titulo}</h2>
                        ${tagesHTML}
                        <p style="margin-top: 0.5rem;">${seccion.descripcion}</p>
                    `;

                    hoja.onclick = (event) => toggleIsolatedFlightWithReturn(hoja, event);
                    paperStackContainer.appendChild(hoja);
                });

                sheets = document.querySelectorAll('.paper-sheet');
                updateMechanics(0);

            } catch (error) {
                console.error("Error al cargar los datos del CV:", error);
                paperStackContainer.innerHTML = `<div class="paper-sheet" style="z-index:1; opacity:1;"><h2 style="color:red;">Error de Carga</h2><p>Verifica que tu archivo 'cv-datos.json' esté en la raíz del repositorio.</p></div>`;
            }
        }

        cargarDatosCV();

        window.addEventListener('mousedown', (e) => {
            if (activeExtractedSheet) return; 

            if (e.button === 0) {
                isDraggingLeft = true;
                startLeftY = e.clientY;
                frontCover.style.transition = 'none';
            } else if (e.button === 1) {
                e.preventDefault();
                isDraggingMiddle = true;
                startMiddleX = e.clientX;
                startMiddleY = e.clientY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDraggingLeft && !activeExtractedSheet) {
                const deltaY = e.clientY - startLeftY;
                startLeftY = e.clientY;

                currentOpenProgress += deltaY * 0.4;
                currentOpenProgress = Math.max(0, Math.min(100, currentOpenProgress));

                updateMechanics(currentOpenProgress);
            }

            if (isDraggingMiddle && !activeExtractedSheet) {
                const deltaX = e.clientX - startMiddleX;
                const deltaY = e.clientY - startMiddleY;
                
                startMiddleX = e.clientX;
                startMiddleY = e.clientY;

                currentRotY += deltaX * 0.25; 
                currentRotX -= deltaY * 0.25; 

                currentRotX = Math.max(-MAX_3D_ROTATION, Math.min(MAX_3D_ROTATION, currentRotX));
                currentRotY = Math.max(-MAX_3D_ROTATION, Math.min(MAX_3D_ROTATION, currentRotY));

                viewport.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) isDraggingLeft = false;
            if (e.button === 1) isDraggingMiddle = false;
        });

        function updateMechanics(progress) {
            const factor = progress / 100;
            const targetAngle = factor * -MAX_FOLDER_OPENING;
            
            frontCover.style.transform = `rotateX(${targetAngle}deg)`;

            if (progress < 15) {
                frontCover.style.pointerEvents = 'auto';
            } else {
                frontCover.style.pointerEvents = 'none';
            }

            sheets.forEach((sheet, idx) => {
                if (sheet !== activeExtractedSheet && !sheet.classList.contains('returning-sheet')) {
                    sheet.style.transition = 'none';
                    const sheetMaxAngleMultiplier = 0.8 - (idx * (1.2 / (sheets.length || 1)));
                    const currentSheetAngle = targetAngle * Math.max(0.1, sheetMaxAngleMultiplier);
                    const depth = idx * -6;
                    sheet.style.transform = `translateZ(${depth}px) rotateX(${currentSheetAngle}deg)`;
                }
            });
        }

        function toggleIsolatedFlightWithReturn(sheetElement, event) {
            event.stopPropagation(); 

            if (sheetElement === activeExtractedSheet) {
                activeExtractedSheet = null;
                sheetElement.classList.add('returning-sheet');
                sheetElement.style.transition = 'transform 0.45s cubic-bezier(0.25, 1, 0.5, 1)';
                
                const idx = Array.from(sheets).indexOf(sheetElement);
                const factor = currentOpenProgress / 100;
                const targetAngle = factor * -MAX_FOLDER_OPENING;
                const sheetMaxAngleMultiplier = 0.8 - (idx * (1.2 / (sheets.length || 1)));
                const currentSheetAngle = targetAngle * Math.max(0.1, sheetMaxAngleMultiplier);
                const depth = idx * -6;
                
                sheetElement.style.transform = `translateZ(${depth}px) rotateX(${currentSheetAngle}deg) scale(1)`;

                setTimeout(() => {
                    sheetElement.classList.remove('returning-sheet');
                    sheetElement.style.zIndex = ''; 
                    updateMechanics(currentOpenProgress);
                }, 450);

            } else {
                if (activeExtractedSheet || document.querySelector('.returning-sheet')) return; 
                
                activeExtractedSheet = sheetElement;
                sheetElement.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.3, 1)';
                sheetElement.style.zIndex = '999999';

                const invX = -currentRotX;
                const invY = -currentRotY;

                sheetElement.style.transform = `translateY(-140px) translateZ(450px) rotateY(${invY}deg) rotateX(${invX}deg) scale(1.35)`;
            }
        }
    </script>
</body>
</html>
